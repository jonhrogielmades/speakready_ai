<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpeakReady AI is starting</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f8fafc;
            color: #0f172a;
        }

        main {
            width: min(420px, calc(100% - 32px));
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.45rem;
            line-height: 1.2;
        }

        p {
            margin: 0;
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.55;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #020617;
                color: #f8fafc;
            }

            p {
                color: #cbd5e1;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>SpeakReady AI is starting</h1>
        <p>The app is finishing a safe startup check. Please refresh in a moment.</p>
    </main>
</body>
</html>
