name: Deploy to Dokploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dokploy-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP platform requirements
        run: composer check-platform-reqs

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php_file_list="${RUNNER_TEMP}/speakready-php-files.list"
          find app bootstrap config database routes tests -type f -name '*.php' -print0 > "${php_file_list}"
          if [ ! -s "${php_file_list}" ]; then
            echo "::error title=PHP discovery failed::No PHP files were found to lint."
            exit 1
          fi
          while IFS= read -r -d '' file; do
            php -l "${file}" >/dev/null
          done < "${php_file_list}"

      - name: Run unit tests
        run: php artisan test tests/Unit

      - name: Run feature tests in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          feature_test_list="${RUNNER_TEMP}/speakready-feature-tests.list"
          sorted_feature_test_list="${RUNNER_TEMP}/speakready-feature-tests.sorted.list"
          find tests/Feature -type f -name '*Test.php' -print0 > "${feature_test_list}"
          if [ ! -s "${feature_test_list}" ]; then
            echo "::error title=Feature-test discovery failed::No feature test files were found."
            exit 1
          fi
          sort -z "${feature_test_list}" > "${sorted_feature_test_list}"
          while IFS= read -r -d '' test_file; do
            echo "Running ${test_file}"
            php artisan test "${test_file}"
          done < "${sorted_feature_test_list}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build production assets
        run: npm run build

  deploy:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
    steps:
      - name: Validate Dokploy trigger
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${DOKPLOY_WEBHOOK_URL}" ]; then
            echo "DOKPLOY_TRIGGER_MODE=webhook" >> "${GITHUB_ENV}"
            echo "Dokploy webhook trigger is configured."
            exit 0
          fi

          missing=()

          [ -n "${DOKPLOY_URL}" ] || missing+=("DOKPLOY_URL")
          [ -n "${DOKPLOY_API_KEY}" ] || missing+=("DOKPLOY_API_KEY")
          [ -n "${DOKPLOY_COMPOSE_ID}" ] || missing+=("DOKPLOY_COMPOSE_ID")

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "DOKPLOY_TRIGGER_MODE=api" >> "${GITHUB_ENV}"
            echo "Dokploy API trigger is configured."
            exit 0
          fi

          {
            echo "::error title=Dokploy deploy is not configured::Add DOKPLOY_WEBHOOK_URL, or add DOKPLOY_URL, DOKPLOY_API_KEY, and DOKPLOY_COMPOSE_ID as GitHub Actions repository secrets."
            echo "Missing secrets: ${missing[*]}"
            echo "GitHub path: Settings -> Secrets and variables -> Actions -> New repository secret"
          } >&2

          exit 1

      - name: Trigger Dokploy
        shell: bash
        run: |
          set -euo pipefail

          curl_with_retries() {
            curl \
              --fail-with-body \
              --show-error \
              --silent \
              --location \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 60 \
              "$@"
          }

          if [ "${DOKPLOY_TRIGGER_MODE}" = "webhook" ]; then
            curl_with_retries --request POST "${DOKPLOY_WEBHOOK_URL}"
            echo "Triggered Dokploy deployment through DOKPLOY_WEBHOOK_URL."
            exit 0
          fi

          if [ "${DOKPLOY_TRIGGER_MODE}" = "api" ]; then
            short_sha="${GITHUB_SHA::7}"
            dokploy_url="${DOKPLOY_URL%/}"
            payload="$(
              python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "composeId": os.environ["DOKPLOY_COMPOSE_ID"],
              "title": f"GitHub push {os.environ['GITHUB_SHA'][:7]}",
              "description": f"{os.environ['GITHUB_REPOSITORY']}@{os.environ['GITHUB_SHA']}",
              "freshVolumes": False,
          }))
          PY
            )"

            curl_with_retries \
              --request POST "${dokploy_url}/api/compose.deploy" \
              --header "accept: application/json" \
              --header "Content-Type: application/json" \
              --header "x-api-key: ${DOKPLOY_API_KEY}" \
              --data "${payload}"

            echo "Triggered Dokploy compose deployment through the API for ${short_sha}."
            exit 0
          fi

          echo "::error title=Unknown Dokploy trigger mode::DOKPLOY_TRIGGER_MODE was not set by validation."
          exit 1
